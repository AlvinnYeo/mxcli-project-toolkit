<!doctype html>
<!-- SYNTHETIC wireframe for the layout-chrome case: a page drawn inside its app frame, the way a
     full-page wireframe mocks the shell. Paired with layout-app-default.mdl, whose layout renders
     region-topbar / region-sidebar / region-content and whose page renders the h1 and the text. -->
<html><head><meta charset="utf-8"><title>Home</title></head>
<body>
  <div class="wf-screen">
    <div class="region-topbar"><b>My Application</b></div>
    <div class="region-sidebar"><nav><a href="#">Home</a></nav></div>
    <div class="region-content">
      <h1>Home</h1>
      <p>Hello from the content region</p>
    </div>
  </div>
</body></html>
